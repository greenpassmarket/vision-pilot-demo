:root {
  --page: #edf0e9;
  --sheet: rgba(255, 255, 255, 0.53);
  --ink: #29352e;
  --ink-2: #505f55;
  --ink-3: #606e64;
  --rule: rgba(48, 69, 55, 0.17);
  --rule-soft: rgba(48, 69, 55, 0.10);
  --field-edge: rgba(48, 69, 55, 0.23);
  --hover: rgba(255, 255, 255, 0.38);

  --signal: #3a5042;
  --signal-tint: rgba(69, 98, 76, 0.07);
  --signal-edge: rgba(69, 98, 76, 0.22);
  --ok: #38674d;
  --alarm: #9c4438;
  --alarm-tint: #f6ece7;
  --alarm-edge: #dfc2b9;

  --well: #222b26;
  --well-ink: #e8ece5;
  --well-dim: #acb8ad;

  --font: 'Archivo', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: linear-gradient(120deg, #e7ece5 0%, #f4f5ef 54%, #e5eae4 100%) fixed;
  color: var(--ink);
  font: 400 14px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
p {
  margin: 0;
}

a {
  color: inherit;
}

code,
.mono {
  font-family: var(--mono);
  font-size: 0.9em;
}

code,
td.mono {
  white-space: nowrap;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  top: -48px;
  left: 16px;
  z-index: 10;
  padding: 8px 12px;
  border: 0;
  border-radius: 4px;
  background: var(--ink);
  color: #fff;
}

.skip-link:focus {
  top: 12px;
}

.hint {
  display: block;
  color: var(--ink-3);
  font-size: 13.5px;
}

.nowrap {
  white-space: nowrap;
}

/* ---------- quiet glass navigation ---------- */

.icon { flex: none; width: 18px; height: 18px; vertical-align: middle; }

.masthead {
  position: sticky;
  top: 20px;
  z-index: 5;
  width: min(1280px, calc(100% - 64px));
  margin: 24px auto 0;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 16px;
  background: rgba(250, 252, 247, 0.60);
  -webkit-backdrop-filter: blur(22px);
  backdrop-filter: blur(22px);
  box-shadow: 0 6px 28px rgba(39, 55, 43, 0.035), inset 0 1px 0 rgba(255, 255, 255, 0.85);
}

.masthead-inner { display: flex; align-items: center; gap: 30px; min-height: 82px; padding: 15px 24px; }
.wordmark { display: flex; flex: none; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font-size: 26px; font-weight: 480; letter-spacing: -1px; line-height: 1.2; }
.brand-symbol { display: grid; place-items: center; width: 25px; height: 29px; }
.wordmark svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.2; }
.wordmark circle { fill: currentColor; stroke: none; }
.wordmark small { display: block; margin-top: 5px; color: var(--ink-3); font-size: 10px; font-weight: 400; letter-spacing: 0; }
.wordmark small > span { padding: 0 3px; color: #8b968b; }
.masthead nav { display: flex; flex: 1; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.masthead nav a { display: flex; align-items: center; min-height: 36px; padding: 8px 13px; border: 1px solid transparent; border-radius: 7px; color: var(--ink-2); font-size: 12px; font-weight: 400; text-decoration: none; white-space: nowrap; }
.masthead nav a > .icon { display: none; }
.masthead nav a:hover { color: var(--ink); background: rgba(255, 255, 255, 0.3); }
.masthead nav a.is-current { border-color: rgba(255, 255, 255, 0.92); background: rgba(255, 255, 255, 0.65); color: var(--ink); box-shadow: 0 1px 5px rgba(41, 53, 46, 0.035); }
.sidebar-bottom { position: relative; display: flex; flex: none; align-items: center; gap: 16px; }
.persona-control { display: grid; gap: 1px; }
.persona-control > span { padding-left: 2px; color: var(--ink-3); font-size: 9px; }
.persona-control select { width: 156px; padding: 3px 15px 3px 0; border: 0; border-radius: 0; background: transparent; color: var(--ink-2); font-size: 11px; }
.access-details { color: var(--ink-3); font-size: 10px; }
.access-details summary { padding: 8px 0; cursor: pointer; }
.access-details > div { position: absolute; top: calc(100% + 18px); right: -10px; width: 236px; padding: 18px; border: 1px solid white; border-radius: 10px; background: #f5f7f1; box-shadow: 0 8px 28px rgba(39, 55, 43, 0.1); }
.access-details code { display: block; margin-top: 8px; color: var(--ink-2); }
.workspace { display: flex; flex-direction: column; min-height: calc(100dvh - 108px); }
main { width: min(1180px, calc(100% - 80px)); margin: 0 auto; padding: 60px 0 72px; }
main:focus { outline: none; }
.footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: min(1180px, calc(100% - 80px)); margin: auto auto 0; padding: 20px 0 26px; border-top: 1px solid var(--rule-soft); color: var(--ink-3); font-size: 10px; }
.footer > span { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.footer .link-button { font-size: 10px; }
.footer-separator { color: #8b968b; }

/* ---------- page furniture ---------- */

.page-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: baseline;
  gap: 6px 16px;
  margin-bottom: 34px;
}

.page-head > .crumb,
.page-head > .lede {
  grid-column: 1 / -1;
  max-width: 70ch;
}

.page-head > .status {
  justify-self: start;
}

.page-head h1 {
  font-size: 46px;
  line-height: 1.15;
  font-weight: 450;
  letter-spacing: -1.8px;
}

.h1-sub {
  margin-left: 6px;
  color: var(--ink-3);
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0;
}

.lede {
  color: var(--ink-2);
  font-size: 14px;
}

.crumb {
  color: var(--ink-3);
  font-size: 13.5px;
}

.crumb a {
  color: var(--ink-2);
}

.page-head-action {
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
}

.page-head-action .lede {
  margin-top: 6px;
}

.sheet {
  min-width: 0;
  background: var(--sheet);
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: 12px;
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72), 0 4px 24px rgba(39, 55, 43, 0.025);
}

main > .sheet + .sheet,
.incidents-layout + .sheet {
  margin-top: 20px;
}

.sheet-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 4px 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--rule-soft);
}

.sheet-head h2 {
  font-size: 15.5px;
  line-height: 1.3;
  font-weight: 650;
}

.sheet-meta {
  color: var(--ink-3);
  font-size: 13.5px;
}

.sheet-body {
  padding: 16px 20px 20px;
}

.sheet-attention {
  border-top: 3px solid var(--signal);
}

.sheet-alarm {
  border-top: 3px solid var(--alarm);
}

.sheet-dark {
  background: var(--well);
  border-color: var(--well);
  color: var(--well-ink);
}

.stack {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 20px;
  min-width: 0;
}

.empty {
  display: grid;
  justify-items: start;
  gap: 12px;
  max-width: 640px;
  padding: 28px;
}

.empty h2 {
  font-size: 18px;
  font-weight: 650;
}

.problem {
  display: grid;
  justify-items: start;
  gap: 14px;
  max-width: 600px;
  padding: 24px 0;
}

.problem h1 {
  font-size: 28px;
  font-weight: 650;
}

.problem p {
  color: var(--ink-2);
}

.problem .problem-code {
  color: var(--alarm);
  font: 600 13px/1 var(--mono);
}

.safety-banner,
.error-note {
  margin: 0 0 20px;
  padding: 10px 14px;
  border: 1px solid var(--alarm-edge);
  border-left: 4px solid var(--alarm);
  border-radius: 4px;
  background: var(--alarm-tint);
  color: #5e1710;
  font-size: 14.5px;
}

.error-note {
  margin-bottom: 12px;
}

/* ---------- status, tags and badges ---------- */

.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 560;
  white-space: nowrap;
  --dot: var(--ink-3);
}

.status::before,
.dot {
  content: '';
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--dot);
}

.status-signal {
  color: var(--ink);
  --dot: var(--signal);
}

.status-ok {
  --dot: var(--ok);
}

.status-alarm {
  color: var(--alarm);
  --dot: var(--alarm);
}

.status-muted {
  --dot: var(--rule);
}

.status-busy::before {
  animation: none;
}

@keyframes pulse {
  50% {
    opacity: 0.25;
  }
}

.dot {
  display: inline-block;
  --dot: var(--rule);
}

.dot-drafted {
  --dot: var(--signal);
}

.dot-approved {
  --dot: var(--ok);
}

.tag {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 560;
  white-space: nowrap;
}

.tag-signal {
  border-color: var(--signal-edge);
  background: var(--signal-tint);
  color: var(--signal);
}

.tag-unknown,
.is-unknown :is(textarea, select) {
  background: var(--signal-tint);
}

.tag-unknown {
  border-color: var(--signal-edge);
  color: var(--signal);
}

.badge {
  display: inline-block;
  padding: 1px 7px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 650;
  white-space: nowrap;
}

.badge-P1,
.badge-critical {
  border-color: var(--alarm);
  background: var(--alarm);
  color: #fff;
}

.badge-P2,
.badge-major {
  border-color: var(--signal);
  background: var(--signal);
  color: #fff;
}

.badge-P4,
.badge-observation {
  color: var(--ink-3);
}

.badge-unconfirmed {
  border-style: dashed;
  color: var(--ink-3);
  font-weight: 500;
}

/* ---------- controls ---------- */

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 16px;
  border: 1px solid var(--field-edge);
  border-radius: 7px;
  background: var(--sheet);
  color: var(--ink);
  font-size: 13px;
  font-weight: 450;
  text-decoration: none;
  white-space: nowrap;
}

.button:not(:disabled):hover {
  border-color: var(--ink-2);
}

.button-primary {
  border-color: var(--signal);
  background: var(--signal);
  color: #fff;
}

.button-primary:not(:disabled):hover {
  border-color: #24382b;
  background: #24382b;
}

.button-signal {
  border-color: var(--signal);
  background: var(--signal);
  color: #fff;
}

.button-signal:not(:disabled):hover {
  border-color: #24382b;
  background: #24382b;
}

.button-danger {
  border-color: var(--alarm-edge);
  color: var(--alarm);
}

.link-button {
  padding: 4px 0;
  border: 0;
  background: none;
  color: var(--ink-2);
  font-size: 14.5px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.link-button:hover {
  color: var(--ink);
}

input,
select,
textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--field-edge);
  border-radius: 4px;
  background: var(--sheet);
  color: var(--ink);
  font: inherit;
  font-size: 14.5px;
}

textarea {
  min-height: 40px;
  field-sizing: content;
  resize: vertical;
  line-height: 1.45;
}

:is(input, select, textarea):disabled {
  background: var(--hover);
  color: var(--ink-3);
}

:is(input, select, textarea):focus-visible {
  outline-offset: 0;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
}

.field-label {
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 600;
}

/* ---------- rows ---------- */

.rows {
  margin: 0;
  padding: 0;
  list-style: none;
}

.rows > li + li {
  border-top: 1px solid var(--rule-soft);
}

.row {
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr) auto 140px;
  align-items: center;
  gap: 16px;
  padding: 13px 20px;
  text-decoration: none;
}

a.row:hover {
  background: var(--hover);
}

.rows > li:last-child .row {
  border-radius: 0 0 6px 6px;
}

.row-compact {
  grid-template-columns: 76px minmax(0, 1fr) auto;
}

.row-ref {
  color: var(--ink-2);
  font: 13px/1.3 var(--mono);
}

.row-main {
  display: grid;
  min-width: 0;
}

.row-title {
  overflow: hidden;
  font-weight: 520;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.row-sub {
  display: flex;
  flex-wrap: wrap;
  color: var(--ink-3);
  font-size: 13.5px;
}

.row-sub > span + span::before {
  content: '';
  display: inline-block;
  width: 1px;
  height: 0.85em;
  margin: 0 9px;
  background: var(--rule);
  vertical-align: -0.05em;
}

.row-flags {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ---------- layouts ---------- */

.capture-layout,
.detail-layout,
.review-layout,
.survey-layout,
.incidents-layout {
  display: grid;
  gap: 24px;
  align-items: start;
}

.capture-layout {
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
}

.detail-layout {
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
}

.review-layout {
  grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr);
}

.survey-layout {
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
}

.incidents-layout {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
}

/* ---------- capture ---------- */

.capture-media {
  display: grid;
  gap: 18px;
}

.clip-well {
  display: grid;
  place-items: center;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 4px;
  background: var(--well);
}

.clip-well video {
  width: 100%;
  height: 100%;
}

.capture-media .link-button {
  justify-self: start;
}

.capture-form {
  display: grid;
  gap: 20px;
}

.form-field {
  display: grid;
  gap: 6px;
}

.form-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

fieldset {
  margin: 0;
  padding: 0;
  border: 0;
}

fieldset legend {
  margin-bottom: 8px;
  padding: 0;
}

.choice {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.choice label {
  position: relative;
  padding: 7px 14px;
  border: 1px solid var(--field-edge);
  border-radius: 4px;
  font-size: 14.5px;
  font-weight: 560;
  cursor: pointer;
}

.choice label.is-checked {
  border-color: var(--signal);
  background: var(--signal);
  color: #fff;
}

.choice input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.choice label:focus-within {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
}

.problems {
  display: grid;
  gap: 10px;
}

.check {
  display: grid;
  grid-template-columns: 18px 1fr;
  gap: 10px;
  align-items: start;
  cursor: pointer;
}

.check input {
  width: 16px;
  height: 16px;
  margin: 4px 0 0;
  accent-color: var(--ink);
}

.manifest summary {
  color: var(--ink-2);
  font-size: 14px;
  cursor: pointer;
}

.manifest pre {
  max-height: 260px;
  margin: 10px 0 0;
  padding: 12px;
  overflow: auto;
  border: 1px solid var(--rule-soft);
  border-radius: 4px;
  background: var(--hover);
  font: 12px/1.5 var(--mono);
}

.facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px 24px;
  margin: 0;
}

.facts dt {
  color: var(--ink-3);
  font-size: 13px;
}

.facts dd {
  margin: 2px 0 0;
}

.fact-wide {
  grid-column: 1 / -1;
}

.hash {
  color: var(--ink-2);
  font-size: 12px;
  word-break: break-all;
}

/* ---------- pipeline ---------- */

.steps {
  margin: 0;
  padding: 0;
  list-style: none;
}

.step {
  position: relative;
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) 104px 56px;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
}

.step + .step {
  border-top: 1px solid var(--rule-soft);
}

.step-number {
  color: var(--ink-3);
  font: 13px/1 var(--mono);
}

.step-text {
  display: grid;
}

.step-name {
  font-weight: 600;
}

.step-note {
  color: var(--ink-3);
  font-size: 13.5px;
}

.step-state {
  font-size: 13.5px;
  font-weight: 560;
}

.step-time {
  color: var(--ink-3);
  font-size: 12.5px;
  text-align: right;
}

.step-done .step-state {
  color: var(--ok);
}

.step-running {
  background: rgba(249, 247, 240, 0.6);
}

.step-running .step-state {
  color: var(--signal);
}

.step-waiting,
.step-skipped {
  color: var(--ink-3);
}

.step-waiting .step-name,
.step-skipped .step-name {
  font-weight: 500;
}

.step-failed {
  background: var(--alarm-tint);
}

.step-failed :is(.step-name, .step-state) {
  color: var(--alarm);
}



.detail-layout .error-note {
  margin: 0;
}

/* ---------- review ---------- */

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
}

.tabs a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--sheet);
  color: var(--ink-2);
  font: 13px/1.3 var(--mono);
  text-decoration: none;
}

.tabs a.is-current {
  border-color: var(--ink);
  color: var(--ink);
  box-shadow: inset 0 -2px 0 var(--ink);
}

.player {
  padding: 12px;
}

.player-screen {
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 3px;
  background: #000;
}

.player-screen video {
  display: block;
  width: 100%;
  height: 100%;
}

.player-empty {
  display: grid;
  place-items: center;
  height: 100%;
  color: var(--well-dim);
}

.player-caption {
  min-height: 1.5em;
  margin: 10px 2px 0;
  color: #c3ccd0;
  font-size: 13.5px;
}

.keyframe {
  display: block;
  width: 100%;
  height: auto;
}

.strip {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 140px;
  gap: 10px;
  margin: 0;
  padding: 16px 20px;
  overflow-x: auto;
  list-style: none;
}

.strip button {
  display: block;
  width: 100%;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--sheet);
  text-align: left;
}

.strip li.is-current button {
  border-color: var(--ink);
  box-shadow: 0 0 0 1px var(--ink);
}

.strip-meta {
  display: flex;
  justify-content: space-between;
  padding: 5px 8px 6px;
  color: var(--ink-3);
  font-size: 12.5px;
}

.transcript {
  margin: 0;
  padding: 8px 0 10px;
  list-style: none;
}

.transcript button {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 12px;
  width: 100%;
  padding: 7px 20px 7px 17px;
  border: 0;
  border-left: 3px solid transparent;
  background: none;
  color: var(--ink-2);
  font-size: 14.5px;
  line-height: 1.5;
  text-align: left;
}

.transcript .mono {
  padding-top: 2px;
  color: var(--ink-3);
  font-size: 12.5px;
}

.transcript .is-cited button {
  border-left-color: var(--signal);
}

.transcript .is-current button {
  background: var(--hover);
  color: var(--ink);
}

.field {
  display: grid;
  gap: 8px;
  padding: 14px 0;
}

.field:first-child {
  padding-top: 0;
}

.field + .field {
  border-top: 1px solid var(--rule-soft);
}

.field-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
}

.field-head .field-label {
  flex: 1 1 120px;
}

.evidence {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.chip {
  padding: 1px 6px;
  border: 1px solid var(--signal-edge);
  border-radius: 3px;
  background: var(--sheet);
  color: var(--signal);
  font: 12px/1.5 var(--mono);
}

.chip:hover {
  background: var(--signal-tint);
}

.unknown-hint {
  display: none;
}

.is-unknown .unknown-hint {
  display: block;
}

.proposal {
  color: var(--ink-2);
  font-size: 14.5px;
}

.proposal strong {
  color: var(--ink);
}

.confirmed {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 10px;
  font-size: 16px;
  font-weight: 600;
}

.confirmed::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
}

.confirmed .hint {
  font-weight: 400;
}

.sheet-body > .button {
  margin-top: 14px;
}

.decision {
  display: grid;
  gap: 10px;
  padding: 16px 20px;
}

.decision .error-note {
  margin: 0;
}

.duplicate {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 4px 14px;
  margin-bottom: 14px;
  padding: 12px;
  border: 1px solid var(--rule);
  border-radius: 5px;
  text-decoration: none;
}

.duplicate:hover {
  border-color: var(--ink-3);
}

.duplicate > :nth-child(n + 3) {
  grid-column: 2;
}

.duplicate .status {
  justify-self: start;
}

/* ---------- tables ---------- */

.table-sheet {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14.5px;
}

th {
  padding: 10px 14px;
  border-bottom: 1px solid var(--rule);
  color: var(--ink-3);
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
}

td {
  padding: 11px 14px;
  border-top: 1px solid var(--rule-soft);
  vertical-align: top;
}

td.wide {
  min-width: 280px;
}

td a {
  color: var(--ink);
}

.cell-sub {
  display: block;
  color: var(--ink-3);
  font-size: 13px;
}

tr.is-overdue td {
  background: var(--alarm-tint);
}

/* ---------- survey ---------- */

.tree-site + .tree-site {
  margin-top: 24px;
}

.tree-site-name {
  margin-bottom: 6px;
  color: var(--ink-3);
}

.tree-building summary {
  padding: 4px 0;
  font-size: 17px;
  font-weight: 650;
  cursor: pointer;
}

.tree-floor {
  margin: 12px 0 0 6px;
  padding-left: 16px;
  border-left: 1px solid var(--rule);
}

.tree-floor h3 {
  margin-bottom: 4px;
  color: var(--ink-3);
  font-size: 13.5px;
  font-weight: 600;
}

.tree-floor ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.tree-defect {
  display: grid;
  grid-template-columns: 108px minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 8px 10px;
  border-radius: 4px;
  text-decoration: none;
}

.tree-defect:hover {
  background: var(--hover);
}

.tree-defect .badge {
  justify-self: start;
}

.tree-defect-text {
  display: grid;
  min-width: 0;
}

.walk {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
}

/* ---------- incidents ---------- */

.overdue {
  display: grid;
  gap: 3px;
  padding: 14px 20px;
}

.overdue-due {
  color: var(--alarm);
  font-size: 13px;
  font-weight: 650;
}

.overdue .button {
  justify-self: start;
  margin-top: 8px;
}

.heatmap {
  font-size: 13.5px;
}

/* Keep wide evidence and hotspot tables inside their panels on phones. */
@media screen {
  .pack > section,
  .incidents-layout .sheet-body {
    overflow-x: auto;
  }
}

.heatmap th {
  padding: 6px 8px;
  border: 0;
  font-size: 12px;
  text-align: center;
  white-space: normal;
  vertical-align: bottom;
}

.heatmap th:first-child,
.heatmap tbody th {
  padding-left: 0;
  text-align: left;
}

.heatmap tbody th {
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 500;
  vertical-align: middle;
}

.heat {
  min-width: 56px;
  padding: 10px 6px;
  border: 2px solid var(--sheet);
  background: color-mix(in oklab, var(--signal) calc(var(--heat) * 85%), var(--hover));
  font: 13px/1 var(--mono);
  text-align: center;
  vertical-align: middle;
}

.heat.is-hot {
  color: #fff;
  font-weight: 650;
}

/* ---------- evidence pack ---------- */

.pack-tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1040px;
  margin: 0 auto 16px;
}

.pack {
  max-width: 1040px;
  margin: 0 auto;
  padding: 40px 44px;
}

.pack h1 {
  margin: 6px 0 20px;
  font-size: 28px;
  font-weight: 650;
}

.pack h2 {
  margin: 32px 0 12px;
  font-size: 18px;
  font-weight: 650;
}

.title-cells {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin: 0;
  border: 1px solid var(--ink);
}

.title-cells > div {
  padding: 10px 14px;
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}

.title-cells dt {
  color: var(--ink-3);
  font-size: 12.5px;
}

.title-cells dd {
  margin: 2px 0 0;
}

.cell-wide {
  grid-column: 1 / -1;
}

.pack-note {
  margin-top: 14px;
  color: var(--signal);
  font-size: 14.5px;
}

.pack td.mono {
  color: var(--ink-2);
}

.pack td.mono:not(.nowrap) {
  white-space: normal;
}

.pack-action {
  display: block;
  margin-top: 4px;
  color: var(--ink-2);
}

.pack-frames {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 13.5px;
}

.pack-frames li {
  display: grid;
  gap: 6px;
  break-inside: avoid;
}

/* ---------- workflow and observations ---------- */

.eyebrow { margin-bottom: 8px; color: var(--ink-3); font-size: 10px; font-weight: 450; letter-spacing: 0.5px; }
.page-head > .eyebrow { grid-column: 1 / -1; }
.page-head-action .lede { margin-top: 14px; }
.page-head-action .button { align-self: center; }
.button .icon { width: 16px; height: 16px; }

.workflow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: min(680px, 100%); margin: 0 0 32px; padding: 0; list-style: none; }
.workflow li { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 0 8px 13px 0; border-bottom: 1px solid var(--rule-soft); color: var(--ink-3); font-size: 11px; font-weight: 400; }
.workflow-number { color: #7a877c; font: 10px/1 var(--mono); }
.workflow .is-complete { color: var(--ink-2); }
.workflow .is-active { border-bottom-color: var(--signal); color: var(--ink); }
.workflow .is-active .workflow-number { color: var(--signal); }

.queue-summary { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px 24px; margin: 8px 0 24px; }
.summary-totals { display: flex; flex-wrap: wrap; gap: 12px 26px; color: var(--ink-3); font-size: 12px; }
.summary-totals strong { margin-right: 5px; color: var(--ink); font-size: 15px; font-weight: 480; }
.summary-next { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 12px; text-decoration: none; }
.summary-next:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.summary-next .icon { width: 15px; height: 15px; }
.queue-panel { overflow: hidden; }
.queue-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 24px; }
.queue-filters { display: flex; flex-wrap: wrap; gap: 24px; }
.queue-filter { display: flex; align-items: center; gap: 7px; min-height: 36px; padding: 8px 0; border: 0; border-bottom: 1px solid transparent; border-radius: 0; background: transparent; color: var(--ink-3); font-size: 11px; font-weight: 400; }
.queue-filter > span { color: var(--ink-3); font: 9px/1 var(--mono); }
.queue-filter:hover { color: var(--ink); }
.queue-filter.is-current { border-bottom-color: var(--ink); color: var(--ink); }

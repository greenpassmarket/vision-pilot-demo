:root {
  --page: #edf0e9;
  --sheet: rgba(255, 255, 255, 0.53);
  --ink: #29352e;
  --ink-2: #505f55;
  --ink-3: #606e64;
  --rule: rgba(48, 69, 55, 0.17);
  --rule-soft: rgba(48, 69, 55, 0.10);
  --field-edge: rgba(48, 69, 55, 0.23);
  --hover: rgba(255, 255, 255, 0.38);

  --signal: #3a5042;
  --signal-tint: rgba(69, 98, 76, 0.07);
  --ok: #38674d;
  --ok-tint: #e7f0e9;
  --alarm: #9c4438;
  --alarm-tint: #f6ece7;
  --alarm-edge: #dfc2b9;

  --well: #222b26;
  --well-deep: #161c18;
  --well-ink: #e8ece5;
  --well-dim: #acb8ad;
  --well-edge: rgba(232, 236, 229, 0.24);

  --font: 'Archivo', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: linear-gradient(120deg, #e7ece5 0%, #f4f5ef 54%, #e5eae4 100%) fixed;
  color: var(--ink);
  font: 400 14px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
p {
  margin: 0;
}

a {
  color: inherit;
}

code,
.mono {
  font-family: var(--mono);
  font-size: 0.9em;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  top: -48px;
  left: 16px;
  z-index: 10;
  padding: 8px 12px;
  border: 0;
  border-radius: 4px;
  background: var(--ink);
  color: #fff;
}

.skip-link:focus {
  top: 12px;
}

.hint {
  color: var(--ink-3);
  font-size: 13.5px;
}

.icon { flex: none; width: 18px; height: 18px; vertical-align: middle; }

/* ---------- masthead ---------- */

.masthead {
  position: sticky;
  top: 20px;
  z-index: 5;
  width: min(1280px, calc(100% - 64px));
  margin: 24px auto 0;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 16px;
  background: rgba(250, 252, 247, 0.60);
  -webkit-backdrop-filter: blur(22px);
  backdrop-filter: blur(22px);
  box-shadow: 0 6px 28px rgba(39, 55, 43, 0.035), inset 0 1px 0 rgba(255, 255, 255, 0.85);
}

.masthead-inner { display: flex; align-items: center; gap: 30px; min-height: 82px; padding: 15px 24px; }
.wordmark { display: flex; flex: none; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font-size: 26px; font-weight: 480; letter-spacing: -1px; line-height: 1.2; }
.brand-symbol { display: grid; place-items: center; width: 25px; height: 29px; }
.wordmark svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.2; }
.wordmark circle { fill: currentColor; stroke: none; }
.wordmark small { display: block; margin-top: 5px; color: var(--ink-3); font-size: 10px; font-weight: 400; letter-spacing: 0; }
.masthead nav { display: flex; flex: 1; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.masthead nav a { display: flex; align-items: center; min-height: 36px; padding: 8px 13px; border: 1px solid transparent; border-radius: 7px; color: var(--ink-2); font-size: 12px; text-decoration: none; white-space: nowrap; }
.masthead nav a:hover { color: var(--ink); background: rgba(255, 255, 255, 0.3); }
.masthead nav a.is-current { border-color: rgba(255, 255, 255, 0.92); background: rgba(255, 255, 255, 0.65); color: var(--ink); box-shadow: 0 1px 5px rgba(41, 53, 46, 0.035); }
.masthead-controls { display: flex; flex: none; align-items: center; gap: 16px; }
.mode-switch { display: inline-flex; padding: 3px; border: 1px solid var(--rule); border-radius: 9px; background: rgba(255, 255, 255, 0.35); }
.mode-switch button { min-height: 30px; padding: 4px 11px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font-size: 11px; }
.mode-switch button[aria-pressed='true'] { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(41, 53, 46, 0.08); }
.role-control { display: grid; gap: 1px; }
.role-control > span { padding-left: 2px; color: var(--ink-3); font-size: 9px; }
.role-control select { width: 116px; padding: 3px 15px 3px 0; border: 0; border-radius: 0; background: transparent; color: var(--ink-2); font-size: 11px; }

.workspace { display: flex; flex-direction: column; min-height: calc(100dvh - 108px); }
main { width: min(1180px, calc(100% - 80px)); margin: 0 auto; padding: 60px 0 72px; }
main:focus { outline: none; }
.footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: min(1180px, calc(100% - 80px)); margin: auto auto 0; padding: 20px 0 26px; border-top: 1px solid var(--rule-soft); color: var(--ink-3); font-size: 10px; }
.footer a { color: var(--ink-2); text-underline-offset: 3px; }
.footer-separator { padding: 0 6px; color: #8b968b; }

/* ---------- page furniture ---------- */

.page-head { display: grid; gap: 8px; margin-bottom: 34px; }
.page-head h1 { font-size: 46px; line-height: 1.15; font-weight: 450; letter-spacing: -1.8px; }
.page-head-action { grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 16px; }
.lede { max-width: 72ch; color: var(--ink-2); font-size: 14px; }
.crumb { color: var(--ink-3); font-size: 13.5px; }
.crumb a { color: var(--ink-2); }

.summary { display: flex; flex-wrap: wrap; color: var(--ink-2); font-size: 13.5px; }
.summary > span + span::before { content: ''; display: inline-block; width: 1px; height: 0.85em; margin: 0 12px; background: var(--rule); vertical-align: -0.05em; }
.summary strong { color: var(--ink); font-weight: 600; }

.sheet {
  min-width: 0;
  background: var(--sheet);
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: 12px;
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72), 0 4px 24px rgba(39, 55, 43, 0.025);
}

.sheet + .sheet { margin-top: 20px; }
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; padding: 14px 20px; border-bottom: 1px solid var(--rule-soft); }
.sheet-head h2 { font-size: 15.5px; line-height: 1.3; font-weight: 650; }
.sheet-meta { color: var(--ink-3); font-size: 13.5px; }
.sheet-body { padding: 16px 20px 20px; }
.sheet-dark { overflow: hidden; border-color: var(--well); background: var(--well); color: var(--well-ink); }

.problem { display: grid; justify-items: start; gap: 14px; max-width: 600px; padding: 24px 0; }
.problem h1 { font-size: 28px; font-weight: 650; }
.problem p { color: var(--ink-2); }
.problem .problem-code { color: var(--alarm); font: 600 13px/1 var(--mono); }

.error-note,
.success-note { margin-bottom: 4px; padding: 10px 14px; border-radius: 4px; font-size: 14px; }
.error-note { border: 1px solid var(--alarm-edge); border-left: 4px solid var(--alarm); background: var(--alarm-tint); color: #5e1710; }
.success-note { border-left: 4px solid var(--ok); background: var(--ok-tint); }
.success-note a { margin-left: 4px; }

/* ---------- controls ---------- */

.button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 8px 16px; border: 1px solid var(--field-edge); border-radius: 7px; background: var(--sheet); color: var(--ink); font-size: 13px; font-weight: 450; text-decoration: none; white-space: nowrap; }
.button:hover { border-color: var(--ink-2); }
.button-primary { border-color: var(--signal); background: var(--signal); color: #fff; }
.button-primary:hover { border-color: #24382b; background: #24382b; }
.button-quiet { border-color: var(--well-edge); background: transparent; color: var(--well-ink); }
.button-quiet:hover { border-color: var(--well-ink); }

input,
select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--field-edge);
  border-radius: 4px;
  background: var(--sheet);
  color: var(--ink);
  font: inherit;
  font-size: 14.5px;
}

.field-label { color: var(--ink-2); font-size: 13.5px; font-weight: 600; }
.form-fields { display: grid; gap: 16px; }
.form-fields label { display: grid; gap: 6px; }
.form-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }

/* ---------- tables ---------- */

table { width: 100%; border-collapse: collapse; }
th { padding: 12px 20px; border-bottom: 1px solid var(--rule-soft); color: var(--ink-3); font-size: 11px; font-weight: 500; text-align: left; white-space: nowrap; }
td { padding: 12px 20px; border-top: 1px solid var(--rule-soft); vertical-align: middle; }
tbody tr:first-child td { border-top: 0; }
td.number,
th.number { text-align: right; }
td.mono { white-space: nowrap; }
td a { text-underline-offset: 3px; }

/* ---------- portfolio ---------- */

.portfolio-table { position: relative; }
.portfolio-table tbody tr:hover { background: var(--hover); }
.code-button { min-width: 82px; padding: 5px 10px; border: 1px solid var(--signal); border-radius: 6px; background: var(--signal-tint); color: var(--signal); font: 600 13px/1.2 var(--mono); }
.code-button:hover { background: var(--signal); color: #fff; }

.reel-preview { position: absolute; top: calc(var(--preview-top, 0px) + 6px); left: 20px; z-index: 3; width: 340px; pointer-events: none; }
.reel-small { overflow: hidden; border-radius: 10px; background: var(--well); color: var(--well-ink); box-shadow: 0 14px 40px rgba(22, 30, 25, 0.28); }
.reel-small .reel-stage { aspect-ratio: 3 / 2; }
.reel-small .reel-stage img { object-fit: cover; }
.reel-small .reel-caption { display: flex; justify-content: space-between; padding: 7px 12px; font: 12px/1.4 var(--mono); }

.building-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin: 0; padding: 0; list-style: none; }
.building-card { display: grid; align-content: start; gap: 4px; width: 100%; height: 100%; padding: 0 0 18px; border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 14px; background: var(--sheet); text-align: left; overflow: hidden; box-shadow: 0 4px 24px rgba(39, 55, 43, 0.04); }
.building-card:hover { border-color: var(--signal); }
.building-card img { display: block; width: 100%; aspect-ratio: 3 / 2; margin-bottom: 10px; object-fit: cover; background: var(--rule-soft); }
.building-card > span { padding: 0 18px; }
.card-code { color: var(--signal); font-size: 14px; font-weight: 600; }
.card-name { font-size: 20px; font-weight: 500; letter-spacing: -0.3px; line-height: 1.25; }
.card-meta { color: var(--ink-3); font-size: 13px; }

/* ---------- reel ---------- */

.reel-stage { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--well-deep); }
.reel-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; animation: reel-in 700ms ease both; }
@keyframes reel-in { from { opacity: 0; } }

.reel-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 16px 20px 10px; }
.reel-caption { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.reel-date { font-size: 28px; font-weight: 450; letter-spacing: -0.6px; line-height: 1.2; }
.reel-count { color: var(--well-dim); font-size: 12.5px; }
.reel-controls { display: flex; gap: 8px; }
.reel-button { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1px solid var(--well-edge); border-radius: 50%; background: transparent; color: var(--well-ink); }
.reel-button:hover { border-color: var(--well-ink); }
.reel-strip { display: flex; gap: 6px; margin: 0; padding: 4px 20px 12px; overflow-x: auto; list-style: none; }
.reel-strip button { padding: 5px 10px; border: 1px solid var(--well-edge); border-radius: 999px; background: transparent; color: var(--well-dim); font: 11px/1.3 var(--mono); white-space: nowrap; }
.reel-strip button.is-current { border-color: var(--well-ink); background: var(--well-ink); color: var(--well); }
.reel-credit { padding: 0 20px 18px; color: var(--well-dim); font-size: 11px; }
.reel-credit a { color: var(--well-ink); text-underline-offset: 3px; }
.sheet-dark :focus-visible,
.reel-dialog :focus-visible { outline-color: var(--well-ink); }

.reel-dialog { width: min(1180px, calc(100vw - 48px)); max-width: none; max-height: calc(100dvh - 48px); padding: 0; border: 0; border-radius: 16px; background: var(--well); color: var(--well-ink); overflow: auto; }
.reel-dialog::backdrop { background: rgba(18, 24, 20, 0.78); }
.reel-dialog .reel-stage { aspect-ratio: auto; height: max(240px, calc(100dvh - 330px)); }
.reel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 16px; padding: 18px 20px 16px; }
.reel-code { color: var(--well-dim); font-size: 13px; }
.reel-head h2 { font-size: 26px; font-weight: 450; letter-spacing: -0.5px; line-height: 1.2; }
.reel-place { color: var(--well-dim); font-size: 13px; }
.reel-head-actions { display: flex; gap: 8px; }

/* ---------- building and library ---------- */

.building-reel { margin-bottom: 20px; }
.year { padding: 16px 20px 20px; }
.year + .year { border-top: 1px solid var(--rule-soft); }
.year-label { margin-bottom: 10px; color: var(--ink-3); font-size: 12px; font-weight: 500; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin: 0; padding: 0; list-style: none; }
.tiles-library { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.tile { margin: 0; }
.tile img { display: block; width: 100%; aspect-ratio: 3 / 2; border-radius: 6px; object-fit: cover; background: var(--rule-soft); }
.tile figcaption { display: grid; padding-top: 6px; }
.tile-date { font-size: 13px; font-weight: 550; }
.tile-meta { display: flex; gap: 8px; color: var(--ink-3); font-size: 12px; }
.tile-button,
.tile-link { display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit; text-align: left; text-decoration: none; }
.tile-button:hover img,
.tile-link:hover img { outline: 2px solid var(--signal); outline-offset: 2px; }

.library-search { display: flex; align-items: center; gap: 10px; max-width: 640px; padding: 4px 14px; border: 1px solid var(--field-edge); border-radius: 10px; background: var(--sheet); color: var(--ink-3); }
.library-search input { padding: 10px 0; border: 0; background: none; font-size: 17px; }
.library-search input:focus-visible { outline: none; }
.library-search:focus-within { outline: 2px solid var(--signal); outline-offset: 2px; }
.library-count { margin: 16px 0; color: var(--ink-3); font-size: 13px; }

/* ---------- add photos and credits ---------- */

.add-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.add-layout .sheet + .sheet { margin-top: 0; }
.standard { display: grid; gap: 10px; margin: 0; padding: 16px 20px 0 40px; color: var(--ink-2); }
.standard strong { color: var(--ink); font-weight: 600; }
.standard-note { padding: 16px 20px 20px; }

.credits td { font-size: 13px; }

/* ---------- report ---------- */

.report { max-width: 1000px; }
.report-building { padding: 24px 0; border-top: 1px solid var(--rule); break-inside: avoid; }
.report-code { color: var(--signal); font-size: 13px; font-weight: 600; }
.report-head h2 { font-size: 22px; font-weight: 500; letter-spacing: -0.4px; }
.report-meta { color: var(--ink-2); font-size: 13px; }
.filmstrip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 14px 0 10px; padding: 0; list-style: none; }
.filmstrip img { display: block; width: 100%; aspect-ratio: 3 / 2; border-radius: 4px; object-fit: cover; background: var(--rule-soft); }
.filmstrip span { display: block; padding-top: 4px; color: var(--ink-2); font: 11px/1.3 var(--mono); }
.report-link { color: var(--ink-3); font-size: 12px; overflow-wrap: anywhere; }
.report-link a { color: var(--ink-2); }
.report-note { padding-top: 20px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 11px; overflow-wrap: anywhere; }

/* ---------- tablet mode: touch-sized, readable from across a room ---------- */

:root[data-mode='tablet'] body { font-size: 16px; }
:root[data-mode='tablet'] .masthead nav a { min-height: 44px; padding: 10px 16px; font-size: 14px; }
:root[data-mode='tablet'] .mode-switch button { min-height: 40px; padding: 6px 14px; font-size: 13px; }
:root[data-mode='tablet'] .role-control select { min-height: 40px; font-size: 13px; }
:root[data-mode='tablet'] .lede,
:root[data-mode='tablet'] .summary { font-size: 16px; }
:root[data-mode='tablet'] .button { min-height: 48px; padding: 10px 20px; font-size: 15px; }
:root[data-mode='tablet'] input,
:root[data-mode='tablet'] select { min-height: 48px; font-size: 16px; }
:root[data-mode='tablet'] .tiles { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
:root[data-mode='tablet'] .reel-dialog { width: 100vw; max-height: none; height: 100dvh; border-radius: 0; }
:root[data-mode='tablet'] .reel-dialog .reel-stage { height: max(260px, calc(100dvh - 360px)); }
:root[data-mode='tablet'] .reel-head h2 { font-size: 34px; }
:root[data-mode='tablet'] .reel-date { font-size: 38px; }
:root[data-mode='tablet'] .reel-count { font-size: 15px; }
:root[data-mode='tablet'] .reel-button { width: 60px; height: 60px; }
:root[data-mode='tablet'] .reel-strip button { padding: 9px 14px; font-size: 13px; }
:root[data-mode='tablet'] .reel-credit { font-size: 13px; }

/* ---------- small screens ---------- */

@media (max-width: 1050px) {
  .masthead { width: calc(100% - 40px); }
  .masthead-inner { gap: 18px; padding: 14px 18px; }
  main,
  .footer { width: calc(100% - 64px); }
  main { padding-top: 48px; }
}

@media (max-width: 900px) {
  .masthead { top: 12px; width: calc(100% - 28px); margin-top: 14px; border-radius: 13px; }
  .masthead-inner { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; padding: 16px 16px 12px; }
  .masthead nav { grid-column: 1 / -1; justify-content: start; overflow-x: auto; }
  .masthead-controls { grid-column: 2; grid-row: 1; }
  .masthead nav a { flex: none; }
  main,
  .footer { width: calc(100% - 36px); }
  main { padding-top: 38px; }
  .page-head h1 { font-size: 36px; letter-spacing: -1.2px; }
  .portfolio-table :is(th, td):nth-child(3),
  .portfolio-table :is(th, td):nth-child(4) { display: none; }
  .add-layout { grid-template-columns: minmax(0, 1fr); }
  .filmstrip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 600px) {
  .wordmark small,
  .role-control > span { display: none; }
  .masthead-controls { grid-column: 1 / -1; grid-row: auto; }
  .footer { flex-wrap: wrap; }
  .page-head-action { grid-template-columns: minmax(0, 1fr); }
  .page-head-action .button { justify-self: start; }
  th,
  td { padding-left: 14px; padding-right: 14px; }
  .portfolio-table :is(th, td):nth-child(6) { display: none; }
  .form-pair { grid-template-columns: minmax(0, 1fr); }
  .reel-preview { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .reel-stage img { animation: none; }
}

@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff; font-size: 12px; }
  .masthead,
  .footer,
  .skip-link,
  .report-print { display: none; }
  .workspace { min-height: 0; }
  main { width: 100%; padding: 0; }
  .page-head { margin-bottom: 12px; }
  .page-head h1 { font-size: 26px; letter-spacing: -0.6px; }
  .report-building { padding: 14px 0; }
  .filmstrip { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .sheet { background: #fff; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* Keep glass surfaces legible when transparency is unavailable or reduced. */
@media screen {
  @supports not ((backdrop-filter: blur(16px)) or (-webkit-backdrop-filter: blur(16px))) {
    .masthead, .sheet:not(.sheet-dark) { background: #f6f8f2; }
  }
}

@media screen and (prefers-reduced-transparency: reduce) {
  .masthead, .sheet:not(.sheet-dark) { background: #f6f8f2; -webkit-backdrop-filter: none; backdrop-filter: none; }
}
